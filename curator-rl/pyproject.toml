[project]
name = "curator-rl"
version = "0.1.0"
description = "Cost-aware environment selection for agentic RL training of LLMs (the Curator scheduler layer)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CURATOR team" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=14",
    "pydantic>=2.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "pyright>=1.1.400",
]
# GPU training stack: the exact versions verified on Kaggle and in the CPU tests (docs/TRL_SPIKE.md,
# kaggle/requirements-hf.txt). torch is not pinned: it must be the platform's CUDA build (Kaggle ships it).
# The vLLM stack lives in its own virtualenv: kaggle/requirements-vllm.txt.
train = [
    "trl==1.15.0",
    "transformers==5.16.1",
    "peft==0.20.0",
    "datasets==4.8.5",
    "accelerate==1.14.0",
]
sim = []
viz = ["matplotlib>=3.8"]   # figures (curator_rl.viz); Kaggle images ship matplotlib

[project.scripts]
curator = "curator_rl.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# the library, plus the experiment scripts as a package so they import each other without sys.path hacks (E5)
where = ["src", "."]
include = ["curator_rl*", "experiments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "gpu: requires a GPU (deselected by default in CI)",
]

[tool.coverage.run]
# the whole library (improvement E3); the two GPU-only modules need torch/TRL, which CI does not install
source = ["curator_rl"]
omit = ["*/curator_rl/trainer/trl_adapter.py", "*/curator_rl/trainer/logprob_fallback.py"]

[tool.coverage.report]
fail_under = 85

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"
extend-exclude = ["notebooks"]   # Kaggle runner notebooks: shell-heavy cells, generated, not library code

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # long lines in tables/docs strings; kept readable
    "B905",  # zip() without strict=; all uses zip equal-length same-package tuples
]

[tool.pyright]
# improvement E8: static checking of the library in CI. The two GPU-only modules import torch/TRL,
# which the CPU CI does not install; they are exercised by the CPU TRL tests where torch is present.
include = ["src"]
exclude = ["src/curator_rl/trainer/trl_adapter.py", "src/curator_rl/trainer/logprob_fallback.py"]
typeCheckingMode = "basic"
pythonVersion = "3.11"
reportMissingImports = "warning"
reportMissingModuleSource = "warning"
